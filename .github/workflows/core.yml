name: core-dsp
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build -j
      - name: Testar
        run: ctest --test-dir build --output-on-failure
